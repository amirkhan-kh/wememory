# Overlay: attach Evolution to WAMemory Nest network on Contabo.
# Usage:
#   docker compose -p wamemory-evo -f docker-compose.yml -f docker-compose.contabo.yml up -d
services:
  evolution-api:
    environment:
      WEBHOOK_GLOBAL_URL: http://api:3000/api/evolution/webhook
    networks:
      - evolution
      - wamemory_internal

networks:
  wamemory_internal:
    external: true
    name: wamemory_internal
